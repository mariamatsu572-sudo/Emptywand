name: Build Fabric Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip mod project
        run: unzip -o emptymod-fabric-1.16.5.zip

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 6.9

      - name: Build mod
        working-directory: emptymod
        run: gradle build --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: emptymod-jar
          path: emptymod/build/libs/*.jar
